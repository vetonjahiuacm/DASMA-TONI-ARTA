name: Deploy DASMA-TONI-ARTA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Fix AJV dependencies
        working-directory: frontend
        run: |
          npm install ajv@8 ajv-keywords@5 --save-exact --legacy-peer-deps

      - name: Create required music directory
        run: |
          mkdir -p frontend/src/assets/music
          touch frontend/src/assets/music/.gitkeep

      - name: Build React application
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://api.vetoniartadasme.site
          CI: false
        run: npm run build

      - name: Create SPA fallback
        run: |
          cp frontend/build/index.html frontend/build/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
